name: Compile check (fork)

# Fork-local build verification. The upstream `compile.yml` is gated behind
# `workflow_call` only, and `seekdb.yml` requires OceanBase's internal runners,
# so neither can be triggered from a personal fork. This workflow reproduces the
# `buildbase` recipe (init deps + release build) without the Rust unit tests, so
# a C++ patch can be proven to compile before it is handed to the competition
# evaluation queue.
#
# The same job then replays the official AI-function evaluation case against the
# freshly built `seekdb` binary, so a behaviour patch (not only a compile fix)
# can be verified here instead of waiting for the queue:
#   .github/script/ai_function_e2e/run_ai_e2e.py

on:
  # Upstream keeps compile.yml behind workflow_call only, and a fork cannot
  # dispatch a workflow that does not live on its default branch, so the fork
  # triggers on push to the competition branches instead.
  push:
    branches:
      - 'competition/**'
      - 'ci/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (empty = the dispatched ref)'
        required: false
        type: string
      run_ai_e2e:
        description: 'Replay the AI-function evaluation case after the build'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to '0' to skip the behavioural replay and only prove compilation.
  RUN_AI_E2E: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_ai_e2e && '1' || '0') || '1' }}

jobs:
  build:
    name: Release build
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/local/share/boost \
            2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            git wget rpm rpm2cpio cpio make build-essential binutils \
            m4 libtool-bin libncurses5 python3 python3-pip

      - name: Cache third-party deps
        uses: actions/cache@v4
        with:
          key: deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Initialize release build
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh release --init
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd build_release
          make -j"$(nproc)"

      - name: Assert binaries
        shell: bash
        run: |
          set -euo pipefail
          ls -l build_release/src/observer/seekdb build_release/src/observer/observer

      - name: Install MySQL client library
        if: env.RUN_AI_E2E == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pymysql cryptography

      - name: Replay official AI-function and file-SQL evaluation
        if: env.RUN_AI_E2E == '1'
        shell: bash
        run: |
          set -euo pipefail
          for lib_dir in \
            "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/lib" \
            "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/lib64"; do
            [ -d "$lib_dir" ] && export LD_LIBRARY_PATH="$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          done
          python3 .github/script/ai_function_e2e/run_ai_e2e.py \
            --seekdb build_release/src/observer/seekdb \
            --base-dir "$RUNNER_TEMP/seekdb-ai-e2e" \
            --port 2881 \
            --mock-port 8000 \
            --work-dir "$RUNNER_TEMP/ai-e2e" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Upload evaluation logs
        if: always() && env.RUN_AI_E2E == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ai-e2e-logs
          path: ${{ runner.temp }}/ai-e2e
          if-no-files-found: ignore
          retention-days: 7
