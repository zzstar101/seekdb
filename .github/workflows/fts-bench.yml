name: FTS large bench (fork)

# Measure tools/benchmark/fts_large_bench.sh on a fork runner, so an
# optimisation can be judged against a *pristine* build measured on the same
# machine class instead of against the numbers in FTS_OPTIMIZATION_REPORT.md
# (that report was taken on a local machine 5-8x faster than the VLDB CI whose
# averages form fts_large_bench_baseline.json).
#
# Two dispatch runs -- one on the pristine ref, one on the candidate -- give the
# A/B pairs. Every run repeats the whole benchmark with a fresh server and
# reports mean/min/max per metric, because a single wall-clock sample on a
# shared runner is noisy (the report measured 19%-62% spread on query metrics).
#
# fts_large_bench_score.py is still run, but only for reference: it scores
# against the upstream CI baseline, so its absolute score is meaningless here.
# Compare the measured values of two runs of this workflow instead.

on:
  push:
    branches:
      - 'ci/fts-bench'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build and bench (empty = the dispatched ref)'
        required: false
        type: string
      repeats:
        description: 'How many times to run the whole benchmark (each with a fresh server)'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3', '4', '5']
      replay:
        description: 'Also replay the FTS correctness checks on the same build'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  # Keyed on the ref under test as well: two dispatch runs (e.g. pristine vs
  # candidate) must be able to run side by side, and a push to the workflow
  # branch must not cancel an in-flight measurement of another ref.
  group: fts-bench-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  bench:
    name: Release build + fts_large_bench
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      BENCH_REPEATS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeats || '3' }}
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/local/share/boost \
            2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # actions/checkout only resolves branches and tags: passing a bare SHA
          # makes it fetch refs/heads/<sha> and fail. Check out the dispatched
          # ref here, then fetch the benchmark target explicitly below.
          fetch-depth: 1

      - name: Stage helper scripts
        shell: bash
        run: |
          set -euo pipefail
          # Keep the helpers outside the workspace: the next step replaces the
          # working tree with the benchmark target, which predates them.
          mkdir -p "$RUNNER_TEMP/fts_tools"
          cp -r .github/script/fts_bench/. "$RUNNER_TEMP/fts_tools/"
          ls -l "$RUNNER_TEMP/fts_tools"

      - name: Check out the benchmark target
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.ref }}"
          if [ -z "$target" ]; then
            echo "benchmarking the dispatched ref ${{ github.sha }}"
          else
            echo "fetching target $target"
            # A full SHA can be fetched directly on GitHub; a short SHA cannot,
            # because the server can only resolve refs, not object prefixes.
            if ! git fetch --no-tags --depth=1 origin "$target"; then
              echo "direct fetch failed, resolving $target against the branch tips"
              git fetch --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
              git checkout --detach "$target"
            else
              git checkout --detach FETCH_HEAD
            fi
          fi
          echo "benchmarking commit: $(git rev-parse HEAD)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            git wget rpm rpm2cpio cpio make build-essential binutils \
            m4 libtool-bin libncurses5 python3 python3-pip
          # The benchmark drives the server through the mysql CLI.
          sudo apt-get install -y default-mysql-client \
            || sudo apt-get install -y mysql-client

      - name: Record runner shape
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| ref | \`${{ inputs.ref || github.ref }}\` |"
            echo "| head sha | \`$(git rev-parse HEAD)\` |"
            echo "| runner name | \`${RUNNER_NAME}\` |"
            echo "| cpu model | $(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo | sed 's/^ *//') |"
            echo "| nproc | $(nproc) |"
            echo "| memory | $(awk '/MemTotal/ {printf \"%.1f GiB\", $2/1024/1024}' /proc/meminfo) |"
            echo "| mysql client | $(mysql --version 2>/dev/null || echo missing) |"
            echo "| repeats | ${BENCH_REPEATS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache third-party deps
        uses: actions/cache@v4
        with:
          key: deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Initialize release build
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh release --init
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd build_release
          make -j"$(nproc)"

      - name: Assert binaries
        shell: bash
        run: |
          set -euo pipefail
          ls -l build_release/src/observer/seekdb build_release/src/observer/observer

      - name: Upload seekdb binary
        uses: actions/upload-artifact@v4
        with:
          # Kept so a later comparison of another ref can try to reuse this
          # build instead of paying another ~90 min compile. Reuse has not been
          # proven to work for a full server start yet (the AI E2E attempt saw
          # the server never open its port), so treat it as unverified.
          name: seekdb-binary
          path: |
            build_release/src/observer/seekdb
            build_release/src/observer/observer
          if-no-files-found: error
          retention-days: 14

      - name: Run fts_large_bench
        shell: bash
        run: |
          set -euo pipefail
          for lib_dir in \
            "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/lib" \
            "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/lib64"; do
            [ -d "$lib_dir" ] && export LD_LIBRARY_PATH="$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          done

          SERVER="$GITHUB_WORKSPACE/build_release/src/observer/seekdb"
          OUT="$RUNNER_TEMP/fts-bench"
          mkdir -p "$OUT"

          export MYSQL="mysql -h127.0.0.1 -P2881 -uroot -N -s --default-character-set=utf8mb4"
          export MYSQL_VERBOSE="mysql -h127.0.0.1 -P2881 -uroot --default-character-set=utf8mb4"

          for i in $(seq 1 "${BENCH_REPEATS}"); do
            base="$OUT/db-$i"
            rm -rf "$base"
            mkdir -p "$base"

            # A fresh server per repeat: the build metrics must not reuse a warm
            # buffer pool, and the query metrics are taken after the warmup the
            # benchmark script performs itself.
            "$SERVER" --base-dir="$base" --port=2881 --nodaemon \
              > "$OUT/server-$i.log" 2>&1 &
            server_pid=$!
            echo "$server_pid" > "$OUT/server-$i.pid"

            python3 "$RUNNER_TEMP/fts_tools/wait_for_port.py" --port 2881 --timeout 900

            echo "::group::bench repeat $i"
            LABEL="run-$i" OUTPUT="$OUT/run-$i.txt" \
              bash tools/benchmark/fts_large_bench.sh | tee "$OUT/run-$i.stdout.txt"
            echo "::endgroup::"

            echo "::group::score repeat $i (upstream-CI baseline, reference only)"
            python3 tools/benchmark/fts_large_bench_score.py "$OUT/run-$i.txt" \
              --allow-config-mismatch --json > "$OUT/score-$i.json" || true
            cat "$OUT/score-$i.json"
            echo "::endgroup::"

            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            cp -r "$base/log" "$OUT/log-$i" 2>/dev/null || true
          done

      - name: Replay FTS correctness checks
        if: ${{ inputs.replay == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for lib_dir in \
            "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/lib" \
            "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/lib64"; do
            [ -d "$lib_dir" ] && export LD_LIBRARY_PATH="$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          done

          python3 -m pip install --quiet pymysql cryptography

          SERVER="$GITHUB_WORKSPACE/build_release/src/observer/seekdb"
          OUT="$RUNNER_TEMP/fts-replay"
          rm -rf "$OUT"
          mkdir -p "$OUT/db"

          # A fresh instance: the checks must not inherit the benchmark's data.
          "$SERVER" --base-dir="$OUT/db" --port=2881 --nodaemon > "$OUT/server.log" 2>&1 &
          server_pid=$!
          python3 "$RUNNER_TEMP/fts_tools/wait_for_port.py" --port 2881 --timeout 900

          set +e
          python3 "$RUNNER_TEMP/fts_tools/replay_fts_regression.py" --port 2881 2>&1 | tee "$OUT/replay.log"
          status=${PIPESTATUS[0]}
          set -e

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cp -r "$OUT/db/log" "$OUT/log" 2>/dev/null || true
          exit "$status"

      - name: Summarise metrics across repeats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fts_tools/summarise_metrics.py" \
            "$RUNNER_TEMP/fts-bench" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-bench-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fts-bench
            ${{ runner.temp }}/fts-replay
          if-no-files-found: warn
          retention-days: 14
